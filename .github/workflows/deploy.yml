name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./source

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./source/package-lock.json

      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ./source/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('./source/package-lock.json') }}-${{ hashFiles('./source/**/*.js', './source/**/*.jsx', './source/**/*.ts', './source/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('./source/package-lock.json') }}-

      - run: npm run build

      - run: touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./source/out
          cname: markvangelder.nl
